name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-kmp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install tools
        run: |
          mise install
      - name: Run core-kmp tests
        run: |
          mise x -- gradle -p core-kmp allTests

  core-kmp-api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install tools
        run: |
          mise install
      - name: Verify public API stability
        run: |
          mise x -- gradle -p core-kmp apiCheck

  android-example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install tools
        run: |
          mise install
      - name: Assemble Android example
        run: |
          mise x -- gradle :core-kmp-example-android:assembleDebug

  # The plugin supports Flutter 3.24 and newer: test the minimum and the latest
  # stable. Keep `minimum` in sync with `environment.flutter` in
  # flutter-plugin/pubspec.yaml and `latest` with mise.toml.
  flutter-plugin:
    name: flutter-plugin (${{ matrix.label }} ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            flutter: '3.24.5'
            java: '17'
          - label: latest
            flutter: '3.50.1'
            java: '21'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
      - name: Resolve lowest allowed dependencies (minimum)
        if: matrix.label == 'minimum'
        working-directory: flutter-plugin
        run: flutter pub downgrade
      - name: Resolve dependencies (latest)
        if: matrix.label == 'latest'
        working-directory: flutter-plugin
        run: flutter pub get
      - name: Check formatting
        working-directory: flutter-plugin
        run: dart format -o none --set-exit-if-changed lib test example/lib example/test
      - name: Analyze plugin
        working-directory: flutter-plugin
        run: flutter analyze
      - name: Test plugin
        working-directory: flutter-plugin
        run: flutter test
      # The committed example uses AGP 9 with built-in Kotlin. For the
      # minimum, the example runs inside a host app generated by that
      # Flutter's own `flutter create` (AGP 8.1, Kotlin 1.8.22, Gradle 8.3).
      # For the latest, the same check covers AGP 9 with
      # android.builtInKotlin=false, which `flutter create` still writes.
      - name: Example analyze, test and Android build (minimum)
        if: matrix.label == 'minimum'
        run: scripts/flutter-host-check.sh --lowest
      - name: Example analyze, test and Android build (latest)
        if: matrix.label == 'latest'
        working-directory: flutter-plugin/example
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
      - name: Example in a new host app (latest)
        if: matrix.label == 'latest'
        run: scripts/flutter-host-check.sh

  ios-example-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
      - name: Resolve packages and run example tests
        working-directory: flutter-plugin/example
        run: |
          flutter pub get
          flutter test
          flutter analyze
      - name: Build iOS Simulator example
        working-directory: flutter-plugin/example
        run: flutter build ios --simulator --debug
