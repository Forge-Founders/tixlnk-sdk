name: txlnk_adtech_sdk
description: Flutter plugin wrapper para o SDK de Atribuicao (AdTech) da Tixlnk.
version: 0.3.0
homepage: https://github.com/Forge-Founders/tixlnk-sdk
repository: https://github.com/Forge-Founders/tixlnk-sdk

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.txlnk.sdk.flutter
        pluginClass: TxlnkAdtechSdkPlugin
      ios:
        pluginClass: TxlnkAdtechSdkPlugin
